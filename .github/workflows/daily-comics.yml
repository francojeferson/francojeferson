name: Daily Comics Scraper

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape-comics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Work Chronicles scraper
        run: python scripts/scrape_workchronicles.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          title: "feat(comics): update daily comics [$(date +%Y-%m-%d)]"
          body: "Automated PR to update daily comics"
          branch: daily-comics-updates
          base: main
          labels: automated
          commit-message: "feat(comics): update daily comics [$(date +%Y-%m-%d)]"
